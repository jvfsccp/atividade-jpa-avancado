spring.application.name=lab-hotel

# Banco H2 em memoria (nenhuma instalacao necessaria no laboratorio)
spring.datasource.url=jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Estatisticas do Hibernate (utilizadas na verificacao da regra R7)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
